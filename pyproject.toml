[project]
name = "ai-job-hunter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=1.40,<2",
    "pdfplumber>=0.11,<1",
    "pydantic>=2,<3",
    "python-docx>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# The tests import `backend.app.*` from the repo root, but pytest's default
# prepend mode only reaches `backend/tests` (that directory has no
# __init__.py), so the repo root has to be on sys.path explicitly.
pythonpath = ["."]
testpaths = ["backend/tests"]
